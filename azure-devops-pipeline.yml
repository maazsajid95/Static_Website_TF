trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: terraform-vars
  - name: serviceConnection
    value: 'maazhotmail-azure-connection'
  - name: backendResourceGroup
    value: 'mathpracs-tfstate-rg'
  - name: backendStorageAccount
    value: 'mathpracstfstate'
  - name: backendContainer
    value: 'tfstate'
  - name: backendKey
    value: 'static-site.terraform.tfstate'

stages:
  - stage: Validate
    displayName: 'Terraform Validate & Plan'
    jobs:
      - job: TerraformPlan
        displayName: 'Init and Plan'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainer)
              backendAzureRmKey: $(backendKey)

          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: $(serviceConnection)
              commandOptions: '-var="storage_account_name=$(storage_account_name)" -var="resource_group_name=$(resource_group_name)" -var="location=$(location)" -var="project_name=$(project_name)" -var="subscription_id=$(subscription_id)"'

  - stage: Deploy
    displayName: 'Terraform Apply'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: TerraformApply
        displayName: 'Apply Infrastructure'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: 'latest'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    backendServiceArm: $(serviceConnection)
                    backendAzureRmResourceGroupName: $(backendResourceGroup)
                    backendAzureRmStorageAccountName: $(backendStorageAccount)
                    backendAzureRmContainerName: $(backendContainer)
                    backendAzureRmKey: $(backendKey)

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    environmentServiceNameAzureRM: $(serviceConnection)
                    commandOptions: '-var="storage_account_name=$(storage_account_name)" -var="resource_group_name=$(resource_group_name)" -var="location=$(location)" -var="project_name=$(project_name)" -var="subscription_id=$(subscription_id)"'